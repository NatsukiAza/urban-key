<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Selector de fecha</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#502558}a:hover{color:#3A1A40}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 760px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); font-family: Nunito, sans-serif">

  <!-- CLARO -->
  <div style="background: #F7F5F9; padding: 40px; display: flex; flex-direction: column; gap: 8px; color: #1B1424">
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #5C5F77; margin-bottom: 8px">Modo claro</span>
    <span style="font-size: 13px; font-weight: 700">Fecha estimada de cierre <span style="font-weight: 600; color: #5C5F77; font-size: 12px">Opcional</span></span>
    <div style="width: 260px; height: 40px; border: 1.5px solid #502558; border-radius: 9px; background: #FFFFFF; display: flex; align-items: center; padding: 0 6px 0 12px; gap: 8px; box-shadow: 0 0 0 3px rgba(80,37,88,0.12); box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#502558" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="flex: 1; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{valueColorL}}">{{valueText}}</span>
      <sc-if value="{{hasValue}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Borrar fecha" onClick="{{clear}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #5C5F77; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      </sc-if>
    </div>
    <span style="font-size: 12px; font-weight: 600; color: #5C5F77">{{helper}}</span>

    <div role="dialog" aria-label="Elegir fecha" style="width: 260px; margin-top: 4px; background: #FFFFFF; border: 1px solid #E7E2EC; border-radius: 14px; box-shadow: 0 16px 36px rgba(30,15,40,0.16); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button aria-label="Mes anterior" onClick="{{prev}}" style="width: 28px; height: 28px; border: 1px solid #E7E2EC; border-radius: 9px; background: #FFFFFF; color: #502558; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <span aria-live="polite" style="font-size: 13px; font-weight: 800">{{monthLabel}}</span>
        <button aria-label="Mes siguiente" onClick="{{next}}" style="width: 28px; height: 28px; border: 1px solid #E7E2EC; border-radius: 9px; background: #FFFFFF; color: #502558; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #5C5F77">{{w.label}}</span>
        </sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" disabled="{{c.disabled}}" onClick="{{c.pick}}" style="{{c.styleL}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #F0ECF3; padding-top: 4px; font-size: 11px; color: #5C5F77">
        <span>O escribí dd/mm/aaaa</span>
        <button onClick="{{clear}}" style="height: 26px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: #502558; font-size: 12px; font-weight: 800; cursor: pointer">Borrar</button>
      </div>
    </div>
  </div>

  <!-- OSCURO -->
  <div style="background: #0E1726; padding: 40px; display: flex; flex-direction: column; gap: 8px; color: #EEF0F7">
    <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; color: #A3A8C3; margin-bottom: 8px">Modo oscuro</span>
    <span style="font-size: 13px; font-weight: 700">Fecha estimada de cierre <span style="font-weight: 600; color: #A3A8C3; font-size: 12px">Opcional</span></span>
    <div style="width: 260px; height: 40px; border: 1.5px solid #D7B8DE; border-radius: 9px; background: #0E1726; display: flex; align-items: center; padding: 0 6px 0 12px; gap: 8px; box-shadow: 0 0 0 3px rgba(215,184,222,0.16); box-sizing: border-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D7B8DE" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span style="flex: 1; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; color: {{valueColorD}}">{{valueText}}</span>
      <sc-if value="{{hasValue}}" hint-placeholder-val="{{ true }}">
        <button aria-label="Borrar fecha" onClick="{{clear}}" style="width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: #A3A8C3; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
      </sc-if>
    </div>
    <span style="font-size: 12px; font-weight: 600; color: #A3A8C3">{{helper}}</span>

    <div role="dialog" aria-label="Elegir fecha" style="width: 260px; margin-top: 4px; background: #161D31; border: 1px solid #2A3350; border-radius: 14px; box-shadow: 0 16px 36px rgba(0,0,0,0.5); padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <button aria-label="Mes anterior" onClick="{{prev}}" style="width: 28px; height: 28px; border: 1px solid #2A3350; border-radius: 9px; background: transparent; color: #D7B8DE; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
        <span style="font-size: 13px; font-weight: 800">{{monthLabel}}</span>
        <button aria-label="Mes siguiente" onClick="{{next}}" style="width: 28px; height: 28px; border: 1px solid #2A3350; border-radius: 9px; background: transparent; color: #D7B8DE; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
          <span style="height: 20px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #A3A8C3">{{w.label}}</span>
        </sc-for>
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
          <button aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" disabled="{{c.disabled}}" onClick="{{c.pick}}" style="{{c.styleD}}">{{c.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #232C45; padding-top: 4px; font-size: 11px; color: #A3A8C3">
        <span>O escribí dd/mm/aaaa</span>
        <button onClick="{{clear}}" style="height: 26px; padding: 0 6px; border: 0; border-radius: 7px; background: transparent; color: #D7B8DE; font-size: 12px; font-weight: 800; cursor: pointer">Borrar</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { y: 2026, m: 10, sel: { y: 2026, m: 10, d: 30 } };
  }
  renderVals() {
    var MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    var today = new Date(2026, 9, 17);
    var self = this;
    var st = this.state;
    var sel = st.sel;
    var pad = function (n) { return n < 10 ? '0' + n : '' + n; };
    var setDate = function (dt) {
      self.setState({ sel: { y: dt.getFullYear(), m: dt.getMonth(), d: dt.getDate() }, y: dt.getFullYear(), m: dt.getMonth() });
    };
    var first = new Date(st.y, st.m, 1);
    var offset = (first.getDay() + 6) % 7;
    var cells = [];
    var base = 'height: 30px; border-radius: 7px; font-size: 12px; font-variant-numeric: tabular-nums; font-family: inherit; display: flex; align-items: center; justify-content: center; ';
    for (var i = 0; i < 42; i++) {
      var dt = new Date(st.y, st.m, 1 - offset + i);
      var inMonth = dt.getMonth() === st.m;
      var isToday = dt.getTime() === today.getTime();
      var isSel = sel && dt.getFullYear() === sel.y && dt.getMonth() === sel.m && dt.getDate() === sel.d;
      var past = dt.getTime() < today.getTime();
      var sL, sD;
      if (isSel) {
        sL = base + 'border: 0; background: #502558; color: #FFFFFF; font-weight: 800; cursor: pointer;';
        sD = base + 'border: 0; background: #D8AC71; color: #2A1A00; font-weight: 800; cursor: pointer;';
      } else if (past) {
        sL = base + 'border: 0; background: transparent; color: #C3C5D3; font-weight: 600; cursor: not-allowed;';
        sD = base + 'border: 0; background: transparent; color: #4A5373; font-weight: 600; cursor: not-allowed;';
      } else if (isToday) {
        sL = base + 'border: 1.5px solid #502558; background: #FFFFFF; color: #502558; font-weight: 800; cursor: pointer;';
        sD = base + 'border: 1.5px solid #D7B8DE; background: transparent; color: #D7B8DE; font-weight: 800; cursor: pointer;';
      } else if (!inMonth) {
        sL = base + 'border: 0; background: transparent; color: #8E91A6; font-weight: 600; cursor: pointer;';
        sD = base + 'border: 0; background: transparent; color: #6E7593; font-weight: 600; cursor: pointer;';
      } else {
        sL = base + 'border: 0; background: transparent; color: #1B1424; font-weight: 700; cursor: pointer;';
        sD = base + 'border: 0; background: transparent; color: #EEF0F7; font-weight: 700; cursor: pointer;';
      }
      (function (d, disabled) {
        cells.push({
          label: '' + d.getDate(),
          aria: d.getDate() + ' de ' + MESES[d.getMonth()].toLowerCase() + ' de ' + d.getFullYear() + (disabled ? ', no disponible' : ''),
          pressed: isSel ? 'true' : 'false',
          disabled: disabled,
          styleL: sL,
          styleD: sD,
          pick: function () { if (!disabled) setDate(d); }
        });
      })(dt, past && !isToday);
    }
    var addDays = function (n) { return new Date(today.getFullYear(), today.getMonth(), today.getDate() + n); };
    var chips = [
      { label: 'Hoy', pick: function () { setDate(today); } },
      { label: 'En 7 días', pick: function () { setDate(addDays(7)); } },
      { label: 'En 30 días', pick: function () { setDate(addDays(30)); } },
      { label: 'Fin de mes', pick: function () { setDate(new Date(today.getFullYear(), today.getMonth() + 1, 0)); } }
    ];
    var hasValue = !!sel;
    var valueText = hasValue ? pad(sel.d) + '/' + pad(sel.m + 1) + '/' + sel.y : 'dd/mm/aaaa';
    var helper = 'Sin fecha elegida';
    if (hasValue) {
      var diff = Math.round((new Date(sel.y, sel.m, sel.d).getTime() - today.getTime()) / 86400000);
      helper = diff === 0 ? 'Hoy' : diff === 1 ? 'Mañana' : 'En ' + diff + ' días';
    }
    return {
      monthLabel: MESES[st.m] + ' ' + st.y,
      weekdays: ['L','M','M','J','V','S','D'].map(function (l) { return { label: l }; }),
      cells: cells,
      hasValue: hasValue,
      valueText: valueText,
      valueColorL: hasValue ? '#1B1424' : '#8E91A6',
      valueColorD: hasValue ? '#EEF0F7' : '#6E7593',
      helper: helper,
      prev: function () { var m = st.m - 1, y = st.y; if (m < 0) { m = 11; y--; } self.setState({ m: m, y: y }); },
      next: function () { var m = st.m + 1, y = st.y; if (m > 11) { m = 0; y++; } self.setState({ m: m, y: y }); },
      clear: function () { self.setState({ sel: null }); }
    };
  }
}
</script>
</body>
</html>
